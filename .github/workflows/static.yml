name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1️⃣ Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configure Pages (required)
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # 3️⃣ (OPTIONAL) Build step
      # REMOVE this section if your repo already contains only static files
      - name: Build site
        run: |
          mkdir -p dist
          cp -r index.html assets css js dist/ 2>/dev/null || true

      # 4️⃣ Upload ONLY the built static files
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist   # 🔥 NEVER use '.' in production

      # 5️⃣ Deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
