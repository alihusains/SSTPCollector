<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SSTP Collector</title>
<style>
body { background:#f1f1f1; font-family:Arial; margin:0; }
table { border-collapse:collapse; margin:120px auto 40px; background:#fff; box-shadow:0 0 20px rgba(0,0,0,.3); }
th,td { border:1px solid #ccc; padding:10px; vertical-align:top; }
th { background:#333; color:#fff; }
tr:nth-child(odd){ background:#f3f3f3; }
.toolbar{background:#333;height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 40px;position:fixed;top:0;left:0;right:0;color:white;}
.toolbar a{color:#fff;text-decoration:none;font-weight:bold;}
.flag { width:24px; vertical-align:middle; margin-right:6px; }
.footbar{text-align:center;background:#333;color:white;padding:10px;}
</style>
</head>

<body>

<div class="toolbar">
  <!-- <a href="https://twitter.com/yebekhe" target="_blank">Twitter</a> -->
  <h1>SSTP Collector</h1>
  <a href="https://github.com/alihusains" target="_blank">GitHub</a>
</div>

<table id="vpnTable">
<thead>
<tr>
  <th>Country</th>
  <th>DDNS / IP</th>
  <th>Sessions</th>
  <th>Line Quality</th>
  <th>SSL-VPN</th>
  <th>OpenVPN</th>
  <th>MS-SSTP</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div class="footbar">Ali Husain Sorathiya © 2026</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const tableBody = document.querySelector("#vpnTable tbody");

  const joinBlock = arr => Array.isArray(arr) ? arr.filter(Boolean).join("<br>") : "";

  fetch("json/configs.json")
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {

      data.forEach(row => {
        if (!Array.isArray(row)) return;

        const tr = document.createElement("tr");

        // Country + Flag
        const country = row[0] || [];
        const tdCountry = document.createElement("td");
        if (country[0]) {
          const flagUrl = "https://vpngate.net" + country[0].replace("..", "");
          tdCountry.innerHTML = `<img class="flag" src="${flagUrl}"> ${country[1] || ""}`;
        }
        tr.appendChild(tdCountry);

        // DDNS / IP
        const tdDDNS = document.createElement("td");
        tdDDNS.innerHTML = joinBlock(row[1]);
        tr.appendChild(tdDDNS);

        // Sessions
        const tdSessions = document.createElement("td");
        tdSessions.innerHTML = joinBlock(row[2]);
        tr.appendChild(tdSessions);

        // Line Quality
        const tdQuality = document.createElement("td");
        tdQuality.innerHTML = joinBlock(row[3]);
        tr.appendChild(tdQuality);

        // SSL-VPN (full block)
        const tdSSL = document.createElement("td");
        tdSSL.innerHTML = joinBlock(row[4]);
        tr.appendChild(tdSSL);

        // OpenVPN (full block + link)
        const openvpn = row[6] || [];
        const tdOVPN = document.createElement("td");
        if (openvpn[0]) {

// https://130.158.75.39/en/do_openvpn.aspx?fqdn=vpn952825947.opengw.net&ip=124.51.253.126&tcp=1419&udp=1819&sid=1770288174693&hid=24013649

          // http://130.158.75.39/do_openvpn.aspx?fqdn=public-vpn-129.opengw.net&ip=219.100.37.103&tcp=443&udp=0&sid=1770286398267&hid=15094319
          
          const url = "https://130.158.75.39/en" + openvpn[0];
          tdOVPN.innerHTML = `<a href="${url}" target="_blank">${openvpn[1] || "OpenVPN Config"}</a><br>${joinBlock(openvpn.slice(2))}`;
        }
        tr.appendChild(tdOVPN);

        // MS-SSTP (full block)
        const tdSSTP = document.createElement("td");
        tdSSTP.innerHTML = joinBlock(row[7]);
        tr.appendChild(tdSSTP);

        tableBody.appendChild(tr);
      });

    })
    .catch(err => {
      tableBody.innerHTML = `<tr><td colspan="7">Failed loading configs: ${err}</td></tr>`;
      console.error(err);
    });

});
</script>

</body>
</html>
